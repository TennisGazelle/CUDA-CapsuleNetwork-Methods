name: PR

on:
  workflow_dispatch:
  push:
    branches:
      - 'revival/**'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - CUDAify

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host unit/docs/package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host test dependencies
        uses: ./.github/actions/host-deps

      - name: Run host CI bundle
        run: make host-ci

      - name: Upload source-package preview
        uses: actions/upload-artifact@v4
        with:
          name: capsule-network-source-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Coverage note
        run: |
          cat <<'EOF'
          This job validates host-only correctness tests, documentation,
          and source packaging. It does NOT execute CUDA kernels and must not be
          interpreted as GPU runtime validation.
          EOF

  host-sanitizer:
    name: Host ASan validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host test dependencies
        uses: ./.github/actions/host-deps

      - name: Run ASan host tests
        run: make host-asan

      - name: Coverage note
        run: |
          echo "AddressSanitizer host tests only. Not CUDA compile or GPU runtime."

  cuda-compile:
    name: CUDA compile-only
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      # The CUDA devel image has no git; checkout@v4 needs it for a real clone
      # (and for submodules). Install tooling before checkout.
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake g++ libarmadillo-dev
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure and compile CUDA targets
        run: |
          make cuda-compile

      - name: Coverage note
        run: |
          cat <<'EOF'
          This job compiles CUDA targets under a CUDA devel container.
          It does NOT execute kernels and is not GPU runtime validation.
          EOF

  gpu-parity:
    name: GPU parity (optional)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run GPU parity tests
        run: make cuda-test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-parity-${{ github.sha }}
          path: testing_artifacts/**
          if-no-files-found: ignore
          retention-days: 7
